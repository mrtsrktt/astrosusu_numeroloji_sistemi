<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Şuşu Numeroloji Sistemi — Numeroloji</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686;
  --brand:#2f5597; --brand2:#4a7bc8; --line:#e3e8f0; --ok:#1e8e5a;
  --warn:#b8860b; --bad:#c0392b; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* ---------- Giriş ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2f5597,#4a7bc8)}
.login-card{background:#fff;border-radius:16px;padding:34px 30px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 4px;font-size:22px;color:var(--brand)}
.login-card p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.btn-primary{width:100%;margin-top:18px;padding:11px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600}
.btn-primary:hover{background:var(--brand2)}
.login-msg{margin-top:12px;font-size:13px;min-height:18px}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:262px;background:#1d2b45;color:#cfd8e6;flex-shrink:0;padding:14px 0;overflow-y:auto;height:100vh;position:sticky;top:0}
#sidebar .brand{padding:6px 18px 14px;font-size:19px;font-weight:700;color:#fff;border-bottom:1px solid #2b3c5c;margin-bottom:8px}
#sidebar .brand small{display:block;font-weight:400;font-size:11px;color:#8fa2c0;margin-top:3px}
.nav-group{margin:10px 0}
.nav-group h4{margin:0;padding:6px 18px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#7f92b1}
.nav-item{display:block;padding:8px 18px 8px 22px;color:#cfd8e6;text-decoration:none;font-size:13px;border-left:3px solid transparent}
.nav-item:hover{background:#25344f;color:#fff}
.nav-item.active{background:#25344f;color:#fff;border-left-color:var(--brand2)}
.nav-item .badge{float:right;font-size:10px;background:#2b3c5c;color:#9fb2d0;border-radius:9px;padding:1px 7px}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
#topbar .crumb{font-size:13px;color:var(--muted)}
#topbar .spacer{flex:1}
#topbar .user{font-size:13px;color:var(--muted)}
#topbar .user b{color:var(--ink)}
.btn-sm{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink)}
.btn-sm:hover{background:#f0f4fa}
.btn-sm.danger{color:var(--bad);border-color:#eccac4}

#content{padding:22px;max-width:1120px;width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
.card h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.card h3{margin:18px 0 8px;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px}
.card .desc{color:var(--muted);font-size:13px;margin:0 0 16px}

.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.grid.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid #cfe0ff;border-color:var(--brand2)}

.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 18px;border:0;border-radius:8px;font-size:14px;font-weight:600}
.btn-go{background:var(--brand);color:#fff}
.btn-go:hover{background:var(--brand2)}
.btn-ghost{background:#eef2f8;color:var(--brand)}
.btn-ghost:hover{background:#e0e8f4}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}

.num-badge{display:inline-block;min-width:34px;text-align:center;background:#eaf1fd;color:var(--brand);border-radius:8px;padding:3px 8px;font-weight:700}
.num-badge.master{background:#fff3d6;color:#9a6b00}

table.data{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.data th,table.data td{border:1px solid var(--line);padding:6px 9px;text-align:left}
table.data th{background:#f2f6fd;color:var(--brand);font-weight:600}
table.data tr:nth-child(even) td{background:#fafcff}

.matrix{display:inline-grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,52px);gap:6px}
.matrix div{background:#eef4ff;border:1px solid #d5e2f7;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.matrix div b{font-size:16px;color:var(--brand)}
.matrix div span{font-size:11px;color:var(--muted)}

.chip{display:inline-block;background:#eef4ff;border:1px solid #d5e2f7;border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 3px;color:var(--brand)}
.chip.warn{background:#fff6e0;border-color:#f0dfae;color:var(--warn)}
.chip.ok{background:#e8f6ee;border-color:#c4e6d3;color:var(--ok)}

.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.history-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:0}
.history-item .h-title{font-weight:600}
.history-item .h-meta{font-size:12px;color:var(--muted)}
.history-item .spacer{flex:1}

.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2f8;color:var(--muted)}
.pill.free{background:#e8f6ee;color:var(--ok)}
.pill.paid{background:#fff3d6;color:var(--warn)}

/* ---------- Rapor ---------- */
#reportView{background:#fff;padding:0}
.report-head{border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end}
.report-head h1{margin:0;font-size:22px;color:var(--brand)}
.report-head .meta{font-size:12px;color:var(--muted);text-align:right}
.report-section{margin-bottom:20px;page-break-inside:avoid}
.report-section h3{font-size:14px;border-bottom:1px solid var(--line);padding-bottom:5px;color:var(--brand)}
.report-foot{margin-top:26px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted);text-align:center}

@media print{
  #sidebar,#topbar,.no-print{display:none !important}
  #content{padding:0;max-width:none}
  body{background:#fff}
  .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>

<!-- ==================== GİRİŞ EKRANI ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Astro Şuşu <span style="font-size:12px;color:#8fa2c0">Numeroloji</span></h1>
    <p class="sub">Yerel numeroloji analiz platformu</p>
    <label for="luser">E-posta / Kullanıcı adı</label>
    <input id="luser" type="text" autocomplete="username" placeholder="ornek@eposta.com">
    <label for="lpass">Şifre</label>
    <input id="lpass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-primary" id="loginBtn">Giriş Yap</button>
    <p class="login-msg" id="loginMsg"></p>
    <p style="font-size:11px;color:#8fa2c0;margin-top:14px;line-height:1.5">
      İlk girişte hesap bu tarayıcıda oluşturulur. Tüm veriler yalnızca sizin
      cihazınızda (localStorage) saklanır; hiçbir sunucuya gönderilmez.
    </p>
  </div>
</div>

<!-- ==================== UYGULAMA ==================== -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">Astro Şuşu Numeroloji Sistemi<small>Numeroloji &amp; Analiz</small></div>
    <div id="navRoot"></div>
  </aside>

  <div id="main">
    <div id="topbar">
      <span class="crumb" id="crumb">Çalışma Alanım</span>
      <span class="spacer"></span>
      <button class="btn-sm" id="btnWorkspace">Çalışma Alanım</button>
      <button class="btn-sm" id="btnHistory">Geçmiş</button>
      <span class="user" id="userBox"></span>
      <button class="btn-sm danger" id="btnLogout">Çıkış</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="astro_sushu_engine.js?v=3"></script>
<script>
/* ============================================================
   UYGULAMA KATMANI
   ============================================================ */
const E = window.AstroSushuEngine;
const LS = {
  users:  "astrosushu_users",
  session:"astrosushu_session",
  people: "astrosushu_people",
  hist:   "astrosushu_history",
};
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); },
};

/* ---------- Modül Tanımları ---------- */
const MODULES = [
  // --- Temel Analizler ---
  {id:"holistic", cat:"Temel Analizler", name:"Bütünsel Numerolojik Analiz", free:true,
   desc:"Ad, soyad ve doğum tarihinden tüm numerolojik katmanları tek ekranda inceler.",
   fields:[{k:"name",label:"Tam Ad",type:"text",ph:"Ad Soyad"},{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderHolistic(f)},
  {id:"fullname", cat:"Temel Analizler", name:"İsim Analizi", free:true,
   desc:"İsmin harf yapısı ve temel sayısal göstergeleri.",
   fields:[{k:"name",label:"Tam Ad",type:"text",ph:"Ad Soyad"}],
   run:(f)=>renderFullName(f)},
  {id:"birthday", cat:"Temel Analizler", name:"Doğum Tarihi Analizi", free:true,
   desc:"Doğum tarihinden yaşam yolu, doğum günü ve yıllara göre dağılım.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderBirthday(f)},
  {id:"compare", cat:"Temel Analizler", name:"Karşılaştırma Analizi", free:true,
   desc:"İki kişinin temel numerolojik göstergelerini karşılaştırır.",
   fields:[{k:"n1",label:"1. Kişi — Ad Soyad",type:"text"},{k:"d1",label:"1. Gün",type:"number"},{k:"m1",label:"1. Ay",type:"number"},{k:"y1",label:"1. Yıl",type:"number"},
           {k:"n2",label:"2. Kişi — Ad Soyad",type:"text"},{k:"d2",label:"2. Gün",type:"number"},{k:"m2",label:"2. Ay",type:"number"},{k:"y2",label:"2. Yıl",type:"number"}],
   run:(f)=>renderCompare(f)},
  {id:"comparenm", cat:"Temel Analizler", name:"İsim Karşılaştırma", free:true,
   desc:"İki ismin sayısal göstergelerini karşılaştırır.",
   fields:[{k:"n1",label:"1. İsim",type:"text"},{k:"n2",label:"2. İsim",type:"text"}],
   run:(f)=>renderCompareName(f)},
  {id:"location", cat:"Temel Analizler", name:"Adres / Lokasyon Analizi", free:true,
   desc:"Adres bileşenlerinin sayısal değeri.",
   fields:[{k:"ulke",label:"Ülke",type:"text"},{k:"eyalet",label:"Eyalet / Bölge",type:"text"},{k:"sehir",label:"Şehir",type:"text"},{k:"ilce",label:"İlçe",type:"text"},{k:"semt",label:"Semt",type:"text"}],
   run:(f)=>renderLocation(f)},
  {id:"identity", cat:"Temel Analizler", name:"Kimlik Numarası Analizi", free:true,
   desc:"Kimlik numarasının rakam frekansı (yankı) tablosu.",
   fields:[{k:"no",label:"Kimlik Numarası",type:"text"}],
   run:(f)=>renderEcho(f.no,"Kimlik Numarası")},
  {id:"phone", cat:"Temel Analizler", name:"Telefon Numarası Analizi", free:true,
   desc:"Telefon numarasının rakam frekansı tablosu.",
   fields:[{k:"no",label:"Telefon Numarası",type:"text"}],
   run:(f)=>renderEcho(f.no,"Telefon Numarası")},
  {id:"carplate", cat:"Temel Analizler", name:"Araba Plaka Analizi", free:true,
   desc:"Plakanın rakam frekansı ve harf değeri.",
   fields:[{k:"no",label:"Araba Plakası",type:"text"}],
   run:(f)=>renderPlate(f.no,"Araba Plakası")},
  {id:"motoplate", cat:"Temel Analizler", name:"Motosiklet Plaka Analizi", free:true,
   desc:"Motosiklet plakasının rakam frekansı ve harf değeri.",
   fields:[{k:"no",label:"Motosiklet Plakası",type:"text"}],
   run:(f)=>renderPlate(f.no,"Motosiklet Plakası")},

  // --- Kişisel Döngüler ---
  {id:"pdate", cat:"Kişisel Döngüler", name:"Kişisel Tarih", free:true,
   desc:"Belirli bir tarihin kişisel gün/ay/yıl titreşimi.",
   fields:[{k:"d",label:"Doğum Gün",type:"number"},{k:"m",label:"Doğum Ay",type:"number"},{k:"y",label:"Doğum Yıl",type:"number"},
           {k:"cd",label:"Hedef Gün",type:"number"},{k:"cm",label:"Hedef Ay",type:"number"},{k:"cy",label:"Hedef Yıl",type:"number"}],
   run:(f)=>renderPersonalDate(f)},
  {id:"pweek", cat:"Kişisel Döngüler", name:"Kişisel Hafta", free:true,
   desc:"Kişisel hafta titreşimi.",
   fields:[{k:"d",label:"Doğum Gün",type:"number"},{k:"m",label:"Doğum Ay",type:"number"},{k:"y",label:"Doğum Yıl",type:"number"},
           {k:"cd",label:"Hedef Gün",type:"number"},{k:"cm",label:"Hedef Ay",type:"number"},{k:"cy",label:"Hedef Yıl",type:"number"}],
   run:(f)=>renderPersonalWeek(f)},
  {id:"pfib", cat:"Kişisel Döngüler", name:"Kişisel Fibonacci", free:true,
   desc:"Yaşam yolundan Fibonacci dizilim modeli.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderFibonacci(f,"Kişisel")},
  {id:"pcycles", cat:"Kişisel Döngüler", name:"Kişisel Döngüler", free:true,
   desc:"Zirve dönemler ve meydan okumalar.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderPinnacles(f)},
  {id:"pfateful", cat:"Kişisel Döngüler", name:"Kadersel Döngüler", free:true,
   desc:"Yaşam yoluna göre kadersel dönemler.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderPinnacles(f,"Kadersel Döngüler")},
  {id:"ptrans", cat:"Kişisel Döngüler", name:"Dönüşüm Yılları", free:true,
   desc:"Kişisel yıl döngüsünde dönüşüm yılları.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"},{k:"cy",label:"Hedef Yıl",type:"number"}],
   run:(f)=>renderTransformation(f)},

  // --- Evrensel Döngüler ---
  {id:"udate", cat:"Evrensel Döngüler", name:"Evrensel Tarih", free:true,
   desc:"Bir tarihin evrensel yıl/ay/gün titreşimi.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderUniversal(f,"Tarih")},
  {id:"uweek", cat:"Evrensel Döngüler", name:"Evrensel Hafta", free:true,
   desc:"Bir tarihin evrensel hafta titreşimi.",
   fields:[{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderUniversal(f,"Hafta")},
  {id:"ufib", cat:"Evrensel Döngüler", name:"Evrensel Fibonacci", free:true,
   desc:"Evrensel yıldan Fibonacci dizilim modeli.",
   fields:[{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderFibonacci({d:1,m:1,y:f.y},"Evrensel")},
  {id:"ucycles", cat:"Evrensel Döngüler", name:"Evrensel Döngüler", free:true,
   desc:"Evrensel sayı döngüleri.",
   fields:[{k:"y",label:"Başlangıç Yılı",type:"number"},{k:"n",label:"Kaç Yıl",type:"number"}],
   run:(f)=>renderUniversalCycles(f)},
  {id:"uwheel", cat:"Evrensel Döngüler", name:"Evrensel Çark", free:true,
   desc:"Evrensel çark hesaplaması (9 yıllık döngü çarkı).",
   fields:[{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderWheel(f)},

  // --- Ekoller ---
  {id:"karmic", cat:"Ekoller", name:"Karma Analizi (Ladini)", free:true,
   desc:"Karmik göstergeler ve eksik sayılar.",
   fields:[{k:"name",label:"Tam Ad",type:"text"},{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderKarmic(f)},
  {id:"destiny", cat:"Ekoller", name:"Kader Matrisi", free:true,
   desc:"İsim + doğum tarihi sayı matrisi ve sentez.",
   fields:[{k:"name",label:"Tam Ad",type:"text"},{k:"d",label:"Gün",type:"number"},{k:"m",label:"Ay",type:"number"},{k:"y",label:"Yıl",type:"number"}],
   run:(f)=>renderDestinyMatrix(f)},

  // --- Araçlar ---
  {id:"compat", cat:"Araçlar", name:"İsim Uyumluluğu", free:true,
   desc:"İki ismin kalp arzusu / kişilik / ifade uyumu.",
   fields:[{k:"n1",label:"1. İsim",type:"text"},{k:"n2",label:"2. İsim",type:"text"}],
   run:(f)=>renderCompatibility(f)},
  {id:"calc", cat:"Araçlar", name:"Hesaplama Aracı", free:true,
   desc:"Herhangi bir metin veya sayının numerolojik değeri.",
   fields:[{k:"val",label:"Değer (metin veya sayı)",type:"text"}],
   run:(f)=>renderCalculator(f)},
  {id:"pin", cat:"Araçlar", name:"Pin Kodu Karşılaştırma", free:true,
   desc:"İki pin kodunun rakam yapısını karşılaştırır.",
   fields:[{k:"p1",label:"1. Pin Kodu",type:"text"},{k:"p2",label:"2. Pin Kodu",type:"text"}],
   run:(f)=>renderPinCompare(f)},
];

const CAT_ORDER = ["Temel Analizler","Kişisel Döngüler","Evrensel Döngüler","Ekoller","Araçlar"];

/* ---------- Yardımcı görünüm parçaları ---------- */
function badge(n){
  const master = E.MASTER_NUMBERS.has(Number(n));
  return `<span class="num-badge${master?" master":""}">${n}</span>`;
}
function kvRows(pairs){
  return `<div class="kv">${pairs.map(([k,v])=>`<span class="k">${esc(k)}</span><span class="v">${v}</span>`).join("")}</div>`;
}
function meaning(n){
  return E.NUMBER_MEANINGS[n] ? `<div style="font-size:12px;color:#6b7686;margin-top:6px">${esc(E.NUMBER_MEANINGS[n])}</div>` : "";
}
function matrixHTML(m){
  return `<div class="matrix">${m.grid.flat().map(c=>
    `<div><b>${c.sayi}</b><span>${c.adet} adet</span></div>`).join("")}</div>`;
}
function tableHTML(headers, rows){
  return `<table class="data"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* ---------- Analiz görünümleri ---------- */
function renderHolistic(f){
  const lp = E.lifePath(f.d,f.m,f.y), ex = E.expressionNumber(f.name),
        su = E.soulUrgeNumber(f.name), pe = E.personalityNumber(f.name),
        ma = E.maturityNumber(f.name,f.d,f.m,f.y), at = E.attitudeNumber(f.d,f.m),
        ba = E.balanceNumber(f.name), co = E.cornerstone(f.name), ca = E.capstone(f.name),
        fv = E.firstVowelValue(f.name), br = E.bridgeNumber(f.name,f.d,f.m,f.y);
  const im = E.numberMatrix(f.name,false), dm = E.numberMatrix(`${f.d}${f.m}${f.y}`,true);
  const synth = {}; for(let i=1;i<=9;i++) synth[i]=(im.counts[i]||0)+(dm.counts[i]||0);
  const sm = { counts:synth, grid:[[3,6,9],[2,5,8],[1,4,7]].map(r=>r.map(v=>({sayi:v,adet:synth[v]}))) };
  const lg = E.letterGroups(f.name), tc = E.transitionCycles(f.name, f.y);
  const ep = E.expressionPlanes(f.name);

  return `
  <h3>Temel Göstergeler</h3>
  ${kvRows([
    ["Yaşam Yolu", badge(lp)+meaning(lp)],
    ["İfade Sayısı", badge(ex)+meaning(ex)],
    ["Kalp Arzusu (Ruh)", badge(su)+meaning(su)],

function addPerson(){
  const p={ name:$("ws_name").value.trim(), d:$("ws_d").value.trim(), m:$("ws_m").value.trim(),
            y:$("ws_y").value.trim(), time:$("ws_time").value.trim(), place:$("ws_place").value.trim() };

  const people=store.get(LS.people,[]); people.splice(i,1); store.set(LS.people,people); renderWorkspaceView();

  const p=store.get(LS.people,[])[i];

  openModule("holistic");
}

function addHistory(moduleName, inputs, resultHTML){
  const h=store.get(LS.hist,[]);
  h.unshift({id:Date.now(), module:moduleName, inputs, html:resultHTML, at:new Date().toLocaleString("tr-TR")});
  store.set(LS.hist, h.slice(0,200));
}
function renderHistory(){
  const h=store.get(LS.hist,[]);
  if(!h.length) return `<div class="card"><h2>Geçmiş Analizler</h2><div class="empty">Henüz analiz çalıştırılmadı.</div></div>`;
  return `<div class="card"><h2>Geçmiş Analizler (${h.length})</h2>
    ${h.map(item=>`<div class="history-item">
      <div><div class="h-title">${esc(item.module)}</div>
      <div class="h-meta">${esc(item.at)} · ${esc(JSON.stringify(item.inputs)).slice(0,80)}</div></div>
      <span class="spacer"></span>
      <button class="btn-sm" onclick="viewHistory(${item.id})">Görüntüle</button>
      <button class="btn-sm danger" onclick="delHistory(${item.id})">Sil</button>
    </div>`).join("")}
    <div class="actions"><button class="btn btn-ghost" onclick="clearHistory()">Tümünü Temizle</button></div>
  </div>`;
}
function viewHistory(id){
  const item=store.get(LS.hist,[]).find(x=>x.id===id); if(!item) return;
  $("crumb").textContent = "Geçmiş / " + item.module;
  $("content").innerHTML = `<div class="card no-print"><button class="btn-sm" onclick="renderHistoryView()">← Geçmişe dön</button>
    <button class="btn-sm" onclick="printReport()">🖨 PDF / Yazdır</button></div>
    <div class="card" id="reportView">
      <div class="report-head"><div><h1>${esc(item.module)}</h1>
      <div style="font-size:12px;color:#6b7686">Astro Şuşu Numeroloji Sistemi — Numeroloji Raporu</div></div>
      <div class="meta">${esc(item.at)}</div></div>
      <div class="report-section">${item.html}</div>
      <div class="report-foot">Astro Şuşu Numeroloji Sistemi · Yerel numeroloji analizi · ${esc(item.at)}</div>
    </div>`;
}
function delHistory(id){ store.set(LS.hist, store.get(LS.hist,[]).filter(x=>x.id!==id)); renderHistoryView(); }
function clearHistory(){ if(confirm("Tüm geçmiş silinsin mi?")){ store.set(LS.hist,[]); renderHistoryView(); } }
function renderHistoryView(){ $("crumb").textContent="Geçmiş"; $("content").innerHTML=renderHistory(); }
function printReport(){ window.print(); }

    html+=`<div class="nav-group"><h4>${esc(cat)}</h4>`;
    mods.forEach(m=>{
      html+=`<a class="nav-item${m.id===activeId?" active":""}" href="#" onclick="openModule('${m.id}');return false;">${esc(m.name)}</a>`;
    });
    html+="</div>";
  });
  root.innerHTML=html;
}

function openModule(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  renderNav(id);
  $("crumb").textContent = m.cat + " / " + m.name;
  const pre=window._prefill||{};
  const fields=m.fields.map(fd=>{
    const val = pre[fd.k]!==undefined ? pre[fd.k] : "";
    return `<div class="field"><label>${esc(fd.label)}</label>
      <input id="fld_${fd.k}" type="${fd.type}" placeholder="${esc(fd.ph||"")}" value="${esc(val)}"></div>`;
  }).join("");
  $("content").innerHTML = `
  <div class="card no-print">
    <h2>${esc(m.name)} ${m.free?'<span class="pill free">Ücretsiz</span>':'<span class="pill paid">Abonelik</span>'}</h2>
    <p class="desc">${esc(m.desc)}</p>
    <div class="grid c4">${fields}</div>
    <div class="actions">
      <button class="btn btn-go" onclick="runModule('${m.id}')">Analiz Et</button>
      <button class="btn btn-ghost" onclick="clearFields('${m.id}')">Temizle</button>
    </div>
  </div>
  <div id="resultArea"></div>`;
  window._prefill=null;
}

function clearFields(id){
  const m=MODULES.find(x=>x.id===id);
  m.fields.forEach(fd=>{ const el=$("fld_"+fd.k); if(el) el.value=""; });
  $("resultArea").innerHTML="";
}

function runModule(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  const f={};
  m.fields.forEach(fd=>{ f[fd.k]=($("fld_"+fd.k)?.value||"").trim(); });
  // Basit zorunluluk kontrolü
  const req=m.fields.filter(fd=>!f[fd.k]);
  const optional = ["time","place","eyalet","semt","cd","cm","cy","cy"];
  if(req.length && !req.every(r=>optional.includes(r.k))){
    // sadece tamamen boşsa uyar
    const allEmpty = m.fields.every(fd=>!f[fd.k]);
    if(allEmpty){ alert("Lütfen alanları doldurun."); return; }
  }
  let html="";
  try{
    html = m.run(f);
  }catch(err){
    html = `<div class="card"><h2>Hata</h2><p>${esc(err.message)}</p></div>`;
    console.error(err);
  }
  const summary = m.fields.map(fd=>`${fd.label}: ${f[fd.k]}`).join(" · ");
  addHistory(m.name, f, html);
  $("resultArea").innerHTML = `
  <div class="card no-print"><button class="btn-sm" onclick="printReport()">🖨 PDF / Yazdır</button>
    <button class="btn-sm" onclick="openModule('${m.id}')">↺ Yeni Analiz</button></div>
  <div class="card" id="reportView">
    <div class="report-head">
      <div><h1>${esc(m.name)}</h1>
        <div style="font-size:12px;color:#6b7686">Astro Şuşu Numeroloji Sistemi — Numeroloji Raporu</div></div>
      <div class="meta">${new Date().toLocaleString("tr-TR")}</div>
    </div>
    <div class="report-section">${html}</div>
    <div class="report-foot">Astro Şuşu Numeroloji Sistemi · Yerel numeroloji analizi · Bu rapor matematiksel/sembolik hesaplama amaçlıdır.</div>
  </div>`;
}

/* ============================================================
   GİRİŞ / OTURUM
   ============================================================ */
function hash(s){ // basit yerel hash (güvenlik amaçlı değil, sadece gizleme)
  let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return String(h);
}
/* Tanımlı kullanıcılar — ikisi de tam yetkili. Şifreler burada tutulmaz,
   yalnızca hash karşılıkları bellekte üretilir. */
function fixedUsers(){
  return {
    "murat": hash("123456"),
    "gizem": hash("112233")
  };
}
function doLogin(){
  const u=$("luser").value.trim().toLowerCase(), p=$("lpass").value;
  const msg=$("loginMsg");
  if(!u||!p){ msg.style.color="#c0392b"; msg.textContent="Kullanıcı adı ve şifre gerekli."; return; }
  const users=fixedUsers();
  if(!(u in users)){
    msg.style.color="#c0392b"; msg.textContent="Böyle bir kullanıcı yok."; return;
  }
  if(users[u]!==hash(p)){
    msg.style.color="#c0392b"; msg.textContent="Şifre hatalı."; return;
  }
  msg.style.color="#1e8e5a"; msg.textContent="Giriş yapılıyor…";
  store.set(LS.session,{user:u});
  startApp(u);
}
function startApp(user){
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userBox").innerHTML = "👤 <b>"+esc(user)+"</b>";
  renderWorkspaceView();
  renderNav(null);
}
function logout(){
  localStorage.removeItem(LS.session);
  location.reload();
}
function renderWorkspaceView(){ $("crumb").textContent="Çalışma Alanım"; $("content").innerHTML=renderWorkspace(); }

/* ---------- Başlat ---------- */
$("loginBtn").addEventListener("click", doLogin);
$("lpass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("luser").addEventListener("keydown", e=>{ if(e.key==="Enter") $("lpass").focus(); });
$("btnLogout").addEventListener("click", logout);
$("btnWorkspace").addEventListener("click", renderWorkspaceView);
$("btnHistory").addEventListener("click", renderHistoryView);

(function boot(){
  const s=store.get(LS.session,null);
  if(s && s.user) startApp(s.user);
})();

/* global fonksiyonlar (inline onclick için) */
window.openModule=openModule; window.runModule=runModule; window.clearFields=clearFields;
window.addPerson=addPerson; window.removePerson=removePerson; window.analyzePerson=analyzePerson;
window.viewHistory=viewHistory; window.delHistory=delHistory; window.clearHistory=clearHistory;
window.renderHistoryView=renderHistoryView; window.printReport=printReport;
</script>
