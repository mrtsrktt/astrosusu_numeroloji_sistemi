<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Astro Şuşu Numeroloji Sistemi — Numeroloji</title>
<style>
:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-alt: #f1f5f9;
  --ink: #0f172a;
  --ink-secondary: #334155;
  --muted: #64748b;
  --brand: #1e3a8a;
  --brand-hover: #1e40af;
  --brand2: #2563eb;
  --brand-light: #eff6ff;
  --line: #e2e8f0;
  --line-subtle: #f1f5f9;
  --ok: #059669;
  --warn: #d97706;
  --bad: #dc2626;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.03), 0 4px 16px -2px rgba(15,23,42,0.04);
  --shadow-hover: 0 8px 24px -4px rgba(15,23,42,0.08);
  --shadow-lg: 0 20px 40px -8px rgba(15,23,42,0.18);
  --sidebar-w: 270px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Giriş Ekranı ---------- */
#loginScreen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top left, #1e3a8a, #0b1329);
  padding: 16px;
}
.login-card {
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 20px;
  padding: 36px 30px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 25px 60px -10px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
}
.login-card h1 {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.02em;
}
.login-card h1 span {
  font-size: 13px;
  font-weight: 600;
  color: #2563eb;
  background: #eff6ff;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 6px;
}
.login-card p.sub {
  margin: 0 0 22px;
  color: #64748b;
  font-size: 13.5px;
}
.login-card label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  margin: 14px 0 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.login-card input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.15s ease;
  background: #ffffff;
}
.login-card input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.btn-primary {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(37,99,235,0.3);
  transition: all 0.15s ease;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  transform: translateY(-1px);
}
.login-msg { margin-top: 12px; font-size: 13px; min-height: 18px; text-align: center; }

/* ---------- Layout & Sidebar ---------- */
#app {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}
#sidebar {
  width: var(--sidebar-w);
  background: #090e1a;
  color: #94a3b8;
  flex-shrink: 0;
  padding: 0 0 24px 0;
  overflow-y: auto;
  height: 100vh;
  position: sticky;
  top: 0;
  border-right: 1px solid rgba(255,255,255,0.06);
  z-index: 100;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 99;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#sidebar .brand {
  padding: 18px 20px 16px;
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 10px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#sidebar .brand-title {
  display: flex;
  flex-direction: column;
}
#sidebar .brand small {
  font-weight: 600;
  font-size: 10.5px;
  color: #64748b;
  margin-top: 3px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
}
.sidebar-close-btn {
  display: none;
  background: rgba(255,255,255,0.08);
  border: 0;
  color: #cbd5e1;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
}
.nav-group { margin: 12px 0 4px; }
.nav-group h4 {
  margin: 0;
  padding: 6px 20px 8px;
  font-size: 10.5px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #475569;
  font-weight: 700;
}
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  margin: 2px 10px;
  border-radius: 8px;
  color: #94a3b8;
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.15s ease;
}
.nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: #ffffff;
}
.nav-item.active {
  background: rgba(37,99,235,0.18);
  color: #60a5fa;
  font-weight: 700;
  box-shadow: inset 3px 0 0 #3b82f6;
}
.nav-item .badge {
  font-size: 10px;
  background: rgba(255,255,255,0.08);
  color: #64748b;
  border-radius: 12px;
  padding: 2px 8px;
  font-weight: 600;
}

/* ---------- Topbar & Main ---------- */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}
#topbar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.btn-menu-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: #ffffff;
  border: 1px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: var(--shadow-xs);
  transition: background 0.15s;
}
.btn-menu-toggle:hover {
  background: #f1f5f9;
}
#topbar .crumb {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#topbar .spacer { flex: 1; }
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#topbar .user {
  font-size: 13px;
  color: var(--muted);
  padding: 6px 12px;
  background: var(--line-subtle);
  border-radius: 8px;
  font-weight: 500;
}
#topbar .user b { color: var(--ink); font-weight: 700; }
.btn-sm {
  padding: 8px 14px;
  border: 1px solid var(--line);
  background: #ffffff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-secondary);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-sm:hover {
  background: #f8fafc;
  border-color: #cbd5e1;
  color: var(--ink);
}
.btn-sm.danger {
  color: var(--bad);
  border-color: #fecaca;
  background: #fff;
}
.btn-sm.danger:hover { background: #fef2f2; }

#content {
  padding: 24px;
  max-width: 1140px;
  width: 100%;
  box-sizing: border-box;
  margin: 0 auto;
}

/* ---------- Kartlar & Izgara ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card h2 {
  margin: 0 0 6px;
  font-size: 19px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.card h3 {
  margin: 20px 0 10px;
  font-size: 15px;
  font-weight: 700;
  color: #0f172a;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.card .desc {
  color: var(--muted);
  font-size: 13.5px;
  margin: 0 0 18px;
  line-height: 1.55;
}

.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(2, 1fr); }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }
.grid.c4 { grid-template-columns: repeat(4, 1fr); }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 42px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 14px;
  font-family: inherit;
  background: #ffffff;
  color: var(--ink);
  transition: all 0.15s ease;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--brand2);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
}

.actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  min-height: 42px;
  padding: 10px 22px;
  border: 0;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.btn-go {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
}
.btn-go:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  transform: translateY(-1px);
}
.btn-ghost {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  background: #e2e8f0;
  color: #0f172a;
}

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; color: var(--ink); }

.num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  text-align: center;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 4px 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  user-select: none;
}
.num-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(37,99,235,0.22);
  background: #dbeafe;
  border-color: #3b82f6;
}
.num-badge.master {
  background: #fffbeb;
  color: #b45309;
  border: 1px solid #fde68a;
  box-shadow: 0 1px 3px rgba(217,119,6,0.12);
}
.num-badge.karmic {
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #fecaca;
  box-shadow: 0 1px 3px rgba(220,38,38,0.12);
}
.num-badge .badge-dot { font-size: 9px; margin-left: 4px; opacity: 0.7; }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; border-radius: 8px; overflow: hidden; }
table.data th, table.data td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
table.data th { background: #f8fafc; color: #1e3a8a; font-weight: 700; }
table.data tr:nth-child(even) td { background: #fafcff; }

.matrix { display: inline-grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 52px); gap: 6px; }
.matrix div {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  box-shadow: var(--shadow-xs);
}
.matrix div b { font-size: 16px; color: #1e3a8a; }
.matrix div span { font-size: 11px; color: var(--muted); }

.chip {
  display: inline-block;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 20px;
  padding: 3px 12px;
  font-size: 12px;
  font-weight: 600;
  margin: 2px 4px;
  color: #1d4ed8;
}
.chip.warn { background: #fffbeb; border-color: #fde68a; color: var(--warn); }
.chip.ok { background: #ecfdf5; border-color: #a7f3d0; color: var(--ok); }

.empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
.history-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.history-item:last-child { border-bottom: 0; }
.history-item .h-title { font-weight: 700; color: var(--ink); }
.history-item .h-meta { font-size: 12px; color: var(--muted); }
.history-item .spacer { flex: 1; }

.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #f1f5f9; color: var(--muted); }
.pill.free { background: #ecfdf5; color: var(--ok); }
.pill.paid { background: #fffbeb; color: var(--warn); }

/* ---------- Rapor ---------- */
#reportView { background: #fff; padding: 0; }
.report-head { border-bottom: 3px solid var(--brand); padding-bottom: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
.report-head h1 { margin: 0; font-size: 22px; color: var(--brand); font-weight: 800; }
.report-head .meta { font-size: 12px; color: var(--muted); text-align: right; }
.report-section { margin-bottom: 22px; page-break-inside: avoid; }
.report-section h3 { font-size: 15px; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 6px; color: var(--brand); }
.report-foot { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 11px; color: var(--muted); text-align: center; }

/* ---------- Dikey Sütunlu OMURGA Tablosu (Görsel Referans & Mobil Uyumlu) ---------- */
.omurga-container {
  margin: 16px auto 24px auto;
  max-width: 440px;
  width: 100%;
  box-sizing: border-box;
}
.omurga-top-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid #cbd5e1;
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  background: #ffffff;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}
.omurga-top-item {
  border-right: 1px solid #cbd5e1;
  padding: 8px 2px;
  cursor: pointer;
  transition: background 0.15s ease;
  overflow: hidden;
  box-sizing: border-box;
}
.omurga-top-item:last-child { border-right: none; }
.omurga-top-item:hover { background: #f8fafc; }
.omurga-top-label {
  font-size: 8.5px;
  font-weight: 800;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 2px;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.omurga-top-val {
  font-size: 12px;
  font-weight: 700;
  color: #1e293b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.omurga-card {
  border: 1px solid #cbd5e1;
  border-top: none;
  border-radius: 0 0 10px 10px;
  background: #ffffff;
  padding: 12px 8px;
  box-shadow: var(--shadow-card);
  width: 100%;
  box-sizing: border-box;
}
.omurga-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.omurga-title {
  font-size: 15px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 0.5px;
}
.omurga-icon-btn {
  background: #334155;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.omurga-icon-btn:hover { background: #1e293b; }

.omurga-table-wrapper {
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  overflow: hidden;
  width: 100%;
  box-sizing: border-box;
}
.omurga-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: inherit;
  font-size: 11.5px;
}
.omurga-table thead tr { background: #e2e8f0; }
.omurga-table th {
  padding: 6px 2px;
  font-size: 11.5px;
  font-weight: 800;
  color: #0f172a;
  border-right: 1px solid #cbd5e1;
  text-align: center;
  box-sizing: border-box;
}
.omurga-table th:last-child { border-right: none; }
.omurga-table td {
  padding: 5px 2px;
  border-right: 1px solid #e2e8f0;
  border-bottom: 1px solid #e2e8f0;
  text-align: center;
  vertical-align: middle;
  box-sizing: border-box;
}
.omurga-table td:last-child { border-right: none; }
.omurga-table tr:last-child td { border-bottom: none; }

/* Sütun genişlikleri - Toplam %100, taşma imkansız */
.omurga-col-dot { width: 7%; padding: 4px 1px !important; }
.omurga-col-r   { width: 11%; padding: 4px 1px !important; }
.omurga-col-num { width: 9%; padding: 4px 1px !important; }
.omurga-col-h   { width: 22%; text-align: left !important; padding-left: 4px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.omurga-col-e   { width: 36%; text-align: left !important; padding-left: 4px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }
.omurga-col-a   { width: 15%; padding: 2px 1px !important; }

/* Yeşil Nokta */
.omurga-green-dot {
  width: 10px;
  height: 10px;
  background: #16a34a;
  border-radius: 50%;
  display: inline-block;
  vertical-align: middle;
  box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.25);
}

/* Aktif Sayı Vurgusu (Mor Kutu) */
.omurga-highlight-num {
  background: #ddd6fe;
  color: #4338ca;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 5px;
  display: inline-block;
  cursor: pointer;
}

/* Pin Kodu Hane Açılımı (A Sütunu) */
.omurga-a-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  padding: 2px 1px;
  width: 100%;
  max-width: 42px;
  border: 1px solid rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  background: #ffffff;
  box-sizing: border-box;
  margin: 0 auto;
}
.omurga-a-box:hover {
  transform: scale(1.06);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.omurga-a-sub {
  font-size: 8.5px;
  font-weight: 700;
  color: #334155;
  line-height: 1;
}

/* Floating Hane Popover & Çakra Detay Modal Yöneticisi */
window.showOmurgaPopover = function(e, num) {
  if (e && e.stopPropagation) e.stopPropagation();
  const ot = window._currentOmurga;
  if (!ot || !ot.rows) return;
  const r = ot.rows.find(x => x.num === num);
  if (!r || r.aNum === null) return;

  let pop = document.getElementById('omurgaFloatingPopover');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'omurgaFloatingPopover';
    pop.className = 'omurga-popover';
    document.body.appendChild(pop);
    document.addEventListener('click', (evt) => {
      if (pop && !pop.contains(evt.target)) {
        pop.style.display = 'none';
      }
    });
  }

  const badgeColor = (r.uyum && r.uyum.title.includes('Zorlu')) ? '#f87171' : '#6ee7b7';

  pop.innerHTML = `
    <div style="position:relative;">
      <button type="button" onclick="document.getElementById('omurgaFloatingPopover').style.display='none'" style="position:absolute;top:-4px;right:-4px;background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:4px;line-height:1;" aria-label="Kapat">✕</button>
      <div style="font-size:13px;font-weight:700;color:#ffffff;line-height:1.3;padding-right:20px;">${r.haneName}</div>
      <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">(${r.ageRange})</div>
      <div style="font-size:11px;font-weight:700;color:#94a3b8;margin-top:4px;letter-spacing:0.3px;">(ETKİ:${r.etki} - STRES:${r.stres} - GÖLGE:${r.golge})</div>
      <div style="height:1px;background:rgba(255,255,255,0.14);margin:10px 0;"></div>
      <div style="font-size:13px;font-weight:700;color:#ffffff;">Uyum</div>
      <div style="font-size:12px;font-weight:700;color:${badgeColor};margin-top:2px;">${r.uyum ? r.uyum.title : '-'}</div>
      <div style="font-size:11px;color:#cbd5e1;margin-top:3px;line-height:1.4;">${r.uyum ? r.uyum.desc : ''}</div>
      <button type="button" class="omurga-popover-btn" onclick="window.openChakraModal(${r.num})">NUMEROLOJİ > ÇAKRA AÇILIMI →</button>
    </div>
  `;

  // Tıklanan kutunun konumuna göre yerleşim
  const target = e.currentTarget || e.target;
  const rect = target.getBoundingClientRect();
  pop.style.display = 'block';
  pop.style.visibility = 'hidden';

  requestAnimationFrame(() => {
    const popWidth = pop.offsetWidth || 280;
    const popHeight = pop.offsetHeight || 190;
    const padding = 12;

    if (window.innerWidth <= 640) {
      pop.style.left = '50%';
      let top = rect.bottom + 8;
      if (top + popHeight > window.innerHeight - padding) {
        top = Math.max(padding, rect.top - popHeight - 8);
      }
      if (top + popHeight > window.innerHeight - padding) {
        top = Math.max(padding, (window.innerHeight - popHeight) / 2);
      }
      pop.style.top = `${top}px`;
    } else {
      let left = rect.left - popWidth - 10;
      if (left < padding) {
        left = Math.max(padding, Math.min(window.innerWidth - popWidth - padding, rect.left));
      }

      let top = rect.top + (rect.height / 2) - (popHeight / 2);
      if (top < padding) top = padding;
      if (top + popHeight > window.innerHeight - padding) {
        top = window.innerHeight - popHeight - padding;
      }

      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }
    pop.style.visibility = 'visible';
  });
};

function renderCompatibility(f){

    const val = pre[fd.k]!==undefined ? pre[fd.k] : "";
    return `<div class="field"><label>${esc(fd.label)}</label>
      <input id="fld_${fd.k}" type="${fd.type}" placeholder="${esc(fd.ph||"")}" value="${esc(val)}"></div>`;
  }).join("");
  const people=getPeople();
  const picker = people.length ? `
    <div class="card no-print" style="background:#f2f7ff;border-color:#cfe0ff">
      <h2 style="font-size:15px">👤 Kayıtlı Müşteri Seç</h2>
      <p class="desc" style="margin-bottom:10px">Kayıtlı bir müşteriyi seçin, alanlar otomatik dolsun.</p>
      <div class="grid c2">
        <div class="field"><select id="custPick" onchange="fillFromSaved(this.value)">
          <option value="">— Müşteri seçin —</option>
          ${people.map((p,i)=>`<option value="${i}">${esc(p.name)} · ${esc(p.d)}.${esc(p.m)}.${esc(p.y)}</option>`).join("")}
        </select></div>
        <div class="field" style="align-self:end"><button class="btn-sm" onclick="fillFromSaved($('custPick').value)">Alanları Doldur</button></div>
      </div>
    </div>` : "";
  $("content").innerHTML = `
  <div class="card no-print">
    <h2>${esc(m.name)} ${m.free?'<span class="pill free">Ücretsiz</span>':'<span class="pill paid">Abonelik</span>'}</h2>
    <p class="desc">${esc(m.desc)}</p>
    <div class="grid c4">${fields}</div>
    <div class="actions">
      <button class="btn btn-go" onclick="runModule('${m.id}')">Analiz Et</button>
      <button class="btn btn-ghost" onclick="clearFields('${m.id}')">Temizle</button>
    </div>
  </div>
  ${picker}
  <div id="resultArea"></div>`;
  window._prefill=null;
}

/* Kayıtlı müşteriyi mevcut modülün alanlarına akıllıca doldur */
function fillFromSaved(i){
  if(i===""||i===null||i===undefined) return;
  const p=getPeople()[Number(i)]; if(!p) return;
  const set=(k,v)=>{ const el=$("fld_"+k); if(el && v!==undefined && v!==null && v!=="") el.value=v; };
  // Temel kişisel alanlar
  set("name", p.name);
  set("n1", p.name);
  ["d","m","y"].forEach(k=>set(k, p[k]));
  ["d1","m1","y1"].forEach(k=>set(k, p[k[0]]));  // 1. kişi
  set("time", p.time);
  set("place", p.place);
  set("sehir", (p.place||"").split(",")[0].trim());
  set("ulke", (p.place||"").split(",").slice(-1)[0].trim());
}

function clearFields(id){
  const m=MODULES.find(x=>x.id===id);
  m.fields.forEach(fd=>{ const el=$("fld_"+fd.k); if(el) el.value=""; });
  $("resultArea").innerHTML="";
}

function triggerPostRender(idOrName, f) {
  if (!f) return;
  setTimeout(() => {
    const isHolistic = idOrName === 'holistic' || idOrName === 'Bütünsel Numerolojik Analiz';
    const isDestiny = idOrName === 'destiny' || idOrName === 'Kader Matrisi';
    const isKarmic = idOrName === 'karmic' || idOrName === 'Karma Analizi (Ladini)';

    if (isHolistic && window.BirthWheelSVG && $('holisticTirolBox')) {
      BirthWheelSVG.render('holisticTirolBox', f.d, f.m, f.y);
    }
    if (isDestiny && window.DestinyMatrixSVG && $('destinyMatrixSvgBox')) {
      DestinyMatrixSVG.render('destinyMatrixSvgBox', { d: f.d, m: f.m, y: f.y, name: f.name });
    }
    if (isKarmic && window.KarmicSVG && $('karmicSvgBox')) {
      KarmicSVG.render('karmicSvgBox', { d: f.d, m: f.m, y: f.y, name: f.name });
    }
  }, 20);
}

function runModule(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  const f={};
  m.fields.forEach(fd=>{ f[fd.k]=($("fld_"+fd.k)?.value||"").trim(); });
  // Basit zorunluluk kontrolü
  const req=m.fields.filter(fd=>!f[fd.k]);
  const optional = ["time","place","eyalet","semt","cd","cm","cy","cy"];
  if(req.length && !req.every(r=>optional.includes(r.k))){
    // sadece tamamen boşsa uyar
    const allEmpty = m.fields.every(fd=>!f[fd.k]);
    if(allEmpty){ alert("Lütfen alanları doldurun."); return; }
  }
  let html="";
  try{
    html = m.run(f);
  }catch(err){
    html = `<div class="card"><h2>Hata</h2><p>${esc(err.message)}</p></div>`;
    console.error(err);
  }
  const summary = m.fields.map(fd=>`${fd.label}: ${f[fd.k]}`).join(" · ");
  addHistory(m.name, f, html);
  $("resultArea").innerHTML = `
  <div class="card no-print"><button class="btn-sm" onclick="printReport()">🖨 PDF / Yazdır</button>
    <button class="btn-sm" onclick="openModule('${m.id}')">↺ Yeni Analiz</button></div>
  <div class="card" id="reportView">
    <div class="report-head">
      <div><h1>${esc(m.name)}</h1>
        <div style="font-size:12px;color:#6b7686">Astro Şuşu Numeroloji Sistemi — Numeroloji Raporu</div></div>
      <div class="meta">${new Date().toLocaleString("tr-TR")}</div>
    </div>
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:#1e40af;display:flex;align-items:center;gap:10px;">
      <span style="font-size:18px;">💡</span>
      <span><b>İpucu:</b> Sayılara (<span style="color:#2f5597;font-weight:700;">mavi/kırmızı/altın butonlar</span>) ve haritalardaki renkli düğümlere tıklayarak kapsamlı pop-up analiz kartlarını açabilirsiniz.</span>
    </div>
    <div class="report-section">${html}</div>
    <div class="report-foot">Astro Şuşu Numeroloji Sistemi · Yerel numeroloji analizi · Bu rapor matematiksel/sembolik hesaplama amaçlıdır.</div>
  </div>`;
  triggerPostRender(m.id, f);
}

/* ============================================================
   GİRİŞ / OTURUM
   ============================================================ */
function hash(s){ // basit yerel hash (güvenlik amaçlı değil, sadece gizleme)
  let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return String(h);
}
/* Tanımlı kullanıcılar — ikisi de tam yetkili. Şifreler burada tutulmaz,
   yalnızca hash karşılıkları bellekte üretilir. */
function fixedUsers(){
  return {
    "murat": hash("123456"),
    "gizem": hash("112233"),
    "ozelhediye34@gmail.com": hash("16351635")
  };
}
function quickLogin(){
  store.set(LS.session, {user: "murat"});
  startApp("murat");
}
function doLogin(){
  const u=$("luser").value.trim().toLowerCase(), p=$("lpass").value;
  const msg=$("loginMsg");
  if(!u||!p){ msg.style.color="#c0392b"; msg.textContent="Kullanıcı adı ve şifre gerekli."; return; }
  const users=fixedUsers();
  if(u in users){
    if(users[u]!==hash(p)){
      msg.style.color="#c0392b"; msg.textContent="Şifre hatalı."; return;
    }
  } else {
    // Dinamik yerel hesap (ilk girişte cihazda oluşturulur)
    const localUsers = store.get(LS.users, {});
    if (localUsers[u]) {
      if (localUsers[u] !== hash(p)) {
        msg.style.color="#c0392b"; msg.textContent="Şifre hatalı."; return;
      }
    } else {
      localUsers[u] = hash(p);
      store.set(LS.users, localUsers);
    }
  }
  msg.style.color="#1e8e5a"; msg.textContent="Giriş yapılıyor…";
  store.set(LS.session,{user:u});
  startApp(u);
}
function startApp(user){
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userBox").innerHTML = "👤 <b>"+esc(user)+"</b>";
  renderWorkspaceView();
  renderNav(null);
}
function logout(){
  localStorage.removeItem(LS.session);
  location.reload();
}
function renderWorkspaceView(){ closeSidebar(); $("crumb").textContent="Çalışma Alanım"; $("content").innerHTML=renderWorkspace(); }
function renderHistoryView(){ closeSidebar(); $("crumb").textContent="Geçmiş"; $("content").innerHTML=renderHistory(); }

function toggleSidebar(){
  const sb = $("sidebar");
  const bd = $("sidebarBackdrop");
  if(!sb) return;
  const isOpen = sb.classList.toggle("open");
  if(bd) bd.classList.toggle("open", isOpen);
}
function closeSidebar(){
  const sb = $("sidebar");
  const bd = $("sidebarBackdrop");
  if(sb) sb.classList.remove("open");
  if(bd) bd.classList.remove("open");
}

/* ---------- Başlat ---------- */
$("loginBtn").addEventListener("click", doLogin);
$("lpass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("luser").addEventListener("keydown", e=>{ if(e.key==="Enter") $("lpass").focus(); });
$("btnLogout").addEventListener("click", logout);
$("btnWorkspace").addEventListener("click", renderWorkspaceView);
$("btnHistory").addEventListener("click", renderHistoryView);
