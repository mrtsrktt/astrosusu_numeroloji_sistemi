<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Derin Numeroloji — Üye Analiz Alanı</title>
<style>
:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-alt: #f1f5f9;
  --ink: #0f172a;
  --ink-secondary: #334155;
  --muted: #64748b;
  --brand: #1e3a8a;
  --brand-hover: #1e40af;
  --brand2: #2563eb;
  --brand-light: #eff6ff;
  --line: #e2e8f0;
  --line-subtle: #f1f5f9;
  --ok: #059669;
  --warn: #d97706;
  --bad: #dc2626;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.03), 0 4px 16px -2px rgba(15,23,42,0.04);
  --shadow-hover: 0 8px 24px -4px rgba(15,23,42,0.08);
  --shadow-lg: 0 20px 40px -8px rgba(15,23,42,0.18);
  --sidebar-w: 270px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Giriş Ekranı ---------- */
#loginScreen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top left, #1e3a8a, #0b1329);
  padding: 16px;
}
.login-card {
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 20px;
  padding: 36px 30px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 25px 60px -10px rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
}
.login-card h1 {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.02em;
}
.login-card h1 span {
  font-size: 13px;
  font-weight: 600;
  color: #2563eb;
  background: #eff6ff;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 6px;
}
.login-card p.sub {
  margin: 0 0 22px;
  color: #64748b;
  font-size: 13.5px;
}
.login-card label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  margin: 14px 0 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.login-card input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.15s ease;
  background: #ffffff;
}
.login-card input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.btn-primary {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(37,99,235,0.3);
  transition: all 0.15s ease;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  transform: translateY(-1px);
}
.login-msg { margin-top: 12px; font-size: 13px; min-height: 18px; text-align: center; }

/* ---------- Layout & Sidebar ---------- */
#app {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}
#sidebar {
  width: var(--sidebar-w);
  background: #090e1a;
  color: #94a3b8;
  flex-shrink: 0;
  padding: 0 0 24px 0;
  overflow-y: auto;
  height: 100vh;
  position: sticky;
  top: 0;
  border-right: 1px solid rgba(255,255,255,0.06);
  z-index: 100;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.sidebar-backdrop.open {
  display: block;
  opacity: 1;
  pointer-events: auto;
}
#sidebar .brand {
  padding: 18px 20px 16px;
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 10px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#sidebar .brand-title {
  display: flex;
  flex-direction: column;
}
#sidebar .brand small {
  font-weight: 600;
  font-size: 10.5px;
  color: #64748b;
  margin-top: 3px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
}
.sidebar-close-btn {
  display: none;
  background: rgba(255,255,255,0.08);
  border: 0;
  color: #cbd5e1;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
}
.nav-group { margin: 12px 0 4px; }
.nav-group h4 {
  margin: 0;
  padding: 6px 20px 8px;
  font-size: 10.5px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #475569;
  font-weight: 700;
}
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  margin: 2px 10px;
  border-radius: 8px;
  color: #94a3b8;
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.15s ease;
}
.nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: #ffffff;
}
.nav-item.active {
  background: rgba(37,99,235,0.18);
  color: #60a5fa;
  font-weight: 700;
  box-shadow: inset 3px 0 0 #3b82f6;
}
.nav-item .badge {
  font-size: 10px;
  background: rgba(255,255,255,0.08);
  color: #64748b;
  border-radius: 12px;
  padding: 2px 8px;
  font-weight: 600;
}

/* ---------- Topbar & Main ---------- */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}
#topbar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.btn-menu-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: #ffffff;
  border: 1px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: var(--shadow-xs);
  transition: background 0.15s;
}
.btn-menu-toggle:hover {
  background: #f1f5f9;
}
#topbar .crumb {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#topbar .spacer { flex: 1; }
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
#topbar .user {
  font-size: 13px;
  color: var(--muted);
  padding: 6px 12px;
  background: var(--line-subtle);
  border-radius: 8px;
  font-weight: 500;
}
#topbar .user b { color: var(--ink); font-weight: 700; }
.btn-sm {
  padding: 8px 14px;
  border: 1px solid var(--line);
  background: #ffffff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-secondary);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-sm:hover {
  background: #f8fafc;
  border-color: #cbd5e1;
  color: var(--ink);
}
.btn-sm.danger {
  color: var(--bad);
  border-color: #fecaca;
  background: #fff;
}
.btn-sm.danger:hover { background: #fef2f2; }

#content {
  padding: 24px;
  max-width: 1140px;
  width: 100%;
  box-sizing: border-box;
  margin: 0 auto;
}

/* ---------- Kartlar & Izgara ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card h2 {
  margin: 0 0 6px;
  font-size: 19px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.card h3 {
  margin: 20px 0 10px;
  font-size: 15px;
  font-weight: 700;
  color: #0f172a;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.card .desc {
  color: var(--muted);
  font-size: 13.5px;
  margin: 0 0 18px;
  line-height: 1.55;
}

.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(2, 1fr); }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }
.grid.c4 { grid-template-columns: repeat(4, 1fr); }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 42px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 14px;
  font-family: inherit;
  background: #ffffff;
  color: var(--ink);
  transition: all 0.15s ease;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--brand2);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
}

.actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  min-height: 42px;
  padding: 10px 22px;
  border: 0;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.btn-go {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
}
.btn-go:hover {
  background: linear-gradient(135deg, #1e40af, #1d4ed8);
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  transform: translateY(-1px);
}
.btn-ghost {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  background: #e2e8f0;
  color: #0f172a;
}

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; color: var(--ink); }

.num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  text-align: center;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 4px 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  user-select: none;
}
.num-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(37,99,235,0.22);
  background: #dbeafe;
  border-color: #3b82f6;
}
.num-badge.master {
  background: #fffbeb;
  color: #b45309;
  border: 1px solid #fde68a;
  box-shadow: 0 1px 3px rgba(217,119,6,0.12);
}
.num-badge.karmic {
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #fecaca;
  box-shadow: 0 1px 3px rgba(220,38,38,0.12);
}
.num-badge .badge-dot { font-size: 9px; margin-left: 4px; opacity: 0.7; }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; border-radius: 8px; overflow: hidden; }
table.data th, table.data td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
table.data th { background: #f8fafc; color: #1e3a8a; font-weight: 700; }
table.data tr:nth-child(even) td { background: #fafcff; }

.matrix { display: inline-grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 52px); gap: 6px; }
.matrix div {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  box-shadow: var(--shadow-xs);
}
.matrix div b { font-size: 16px; color: #1e3a8a; }
.matrix div span { font-size: 11px; color: var(--muted); }

.chip {
  display: inline-block;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 20px;
  padding: 3px 12px;
  font-size: 12px;
  font-weight: 600;
  margin: 2px 4px;
  color: #1d4ed8;
}
.chip.warn { background: #fffbeb; border-color: #fde68a; color: var(--warn); }
.chip.ok { background: #ecfdf5; border-color: #a7f3d0; color: var(--ok); }

.empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
.history-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.history-item:last-child { border-bottom: 0; }
.history-item .h-title { font-weight: 700; color: var(--ink); }
.history-item .h-meta { font-size: 12px; color: var(--muted); }
.history-item .spacer { flex: 1; }

.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #f1f5f9; color: var(--muted); }
.pill.free { background: #ecfdf5; color: var(--ok); }
.pill.paid { background: #fffbeb; color: var(--warn); }

/* ---------- Rapor ---------- */
#reportView { background: #fff; padding: 0; }
.report-head { border-bottom: 1px solid #E7DFE4; padding-bottom: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
.report-head h1 { margin: 0; font-size: 22px; color: #29212C; font-weight: 800; }
.report-head .meta { font-size: 12px; color: var(--muted); text-align: right; }

/* ---------- Analiz Giriş Kartı ---------- */
.card.module-input-card,
.card.holistic-input-card {
  background-color: #FFFCF7;
  border: 1px solid #E7DFE4;
}
.module-input-card h2,
.holistic-input-card h2 {
  color: #29212C;
}
.module-input-card .field,
.holistic-input-card .field {
  min-width: 0;
}
.module-input-card .field input,
.holistic-input-card .field input {
  background-color: #ffffff;
  border: 1px solid #D8CED5;
  color: #29212C;
  font-size: 16px;
  min-height: 44px;
  height: 44px;
  padding: 8px 12px;
  border-radius: 8px;
  box-sizing: border-box;
  width: 100%;
}
.module-input-card .field input:focus,
.holistic-input-card .field input:focus {
  outline: none;
  border-color: #4D304A;
  box-shadow: 0 0 0 3px rgba(77, 48, 74, 0.15);
}
.module-input-card .field input:focus-visible,
.holistic-input-card .field input:focus-visible {
  outline: 2px solid #4D304A;
  outline-offset: 1px;
}
.module-input-card .btn.btn-go,
.holistic-input-card .btn.btn-go {
  background: #4D304A;
  background-image: none;
  color: #ffffff;
  box-shadow: none;
  border: 1px solid #4D304A;
  min-height: 44px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.module-input-card .btn.btn-go:hover,
.holistic-input-card .btn.btn-go:hover {
  background: #3b2438;
  border-color: #3b2438;
  background-image: none;
  box-shadow: none;
  transform: none;
}
.module-input-card .btn.btn-ghost,
.holistic-input-card .btn.btn-ghost {
  background: #ffffff;
  border: 1px solid #E7DFE4;
  color: #4D304A;
  min-height: 44px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  box-shadow: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.module-input-card .btn.btn-ghost:hover,
.holistic-input-card .btn.btn-ghost:hover {
  background: #FFFCF7;
  border-color: #D8CED5;
  color: #29212C;
}
.module-input-card .btn:focus-visible,
.holistic-input-card .btn:focus-visible {
  outline: 2px solid #4D304A;
  outline-offset: 2px;
}

@media (min-width: 481px) {
  .holistic-input-card .grid.c4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
}

@media (max-width: 480px) {
  .card.module-input-card,
  .card.holistic-input-card {
    padding: 16px;
  }
  .holistic-input-card .grid.c4 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .holistic-input-card .grid.c4 .field:first-child {
    grid-column: 1 / -1;
  }
  .module-input-card .actions,
  .holistic-input-card .actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .module-input-card .actions .btn.btn-go,
  .holistic-input-card .actions .btn.btn-go {
    flex: 2 1 0;
    width: auto;
    min-height: 44px;
  }
  .module-input-card .actions .btn.btn-ghost,
  .holistic-input-card .actions .btn.btn-ghost {
    flex: 1 1 0;
    width: auto;
    min-height: 44px;
  }
}

/* ---------- Analiz Kayıtlı Kişi Seç Kartı ---------- */
.card.module-customer-picker,
.card.holistic-customer-picker {
  background-color: #ffffff;
  border: 1px solid #E7DFE4;
  margin-top: 14px;
}
.module-customer-picker h2,
.holistic-customer-picker h2 {
  color: #29212C;
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 6px 0;
}
.module-customer-picker .desc,
.holistic-customer-picker .desc {
  color: #5E5262;
  font-size: 13.5px;
  margin: 0 0 12px 0;
}
.module-picker-row,
.holistic-picker-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}
.module-picker-select-field,
.holistic-picker-select-field {
  flex: 1;
  min-width: 0;
}
.module-picker-select-field select,
.holistic-picker-select-field select {
  width: 100%;
  min-height: 44px;
  height: 44px;
  padding: 8px 12px;
  border: 1px solid #D8CED5;
  background-color: #ffffff;
  color: #29212C;
  font-size: 15px;
  border-radius: 8px;
  box-sizing: border-box;
}
.module-picker-select-field select:focus,
.holistic-picker-select-field select:focus {
  outline: none;
  border-color: #4D304A;
  box-shadow: 0 0 0 3px rgba(77, 48, 74, 0.15);
}
.module-picker-select-field select:focus-visible,
.holistic-picker-select-field select:focus-visible {
  outline: 2px solid #4D304A;
  outline-offset: 1px;
}
.module-picker-btn,
.holistic-picker-btn {
  min-height: 44px;
  height: 44px;
  padding: 8px 18px;
  background-color: #ffffff;
  color: #4D304A;

/* ---------- Dikey Sütunlu OMURGA Tablosu (Görsel Referans & Mobil Uyumlu) ---------- */
.omurga-container {
  margin: 16px auto 24px auto;
  max-width: 440px;
  width: 100%;
  box-sizing: border-box;
}
.omurga-top-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid #cbd5e1;
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  background: #ffffff;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}
.omurga-top-item {
  border-right: 1px solid #cbd5e1;
  padding: 8px 2px;
  cursor: pointer;
  transition: background 0.15s ease;
  overflow: hidden;
  box-sizing: border-box;
}
.omurga-top-item:last-child { border-right: none; }
.omurga-top-item:hover { background: #f8fafc; }
.omurga-top-label {
  font-size: 8.5px;
  font-weight: 800;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 2px;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.omurga-top-val {
  font-size: 12px;
  font-weight: 700;
  color: #1e293b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.omurga-card {
  border: 1px solid #cbd5e1;
  border-top: none;
  border-radius: 0 0 10px 10px;
  background: #ffffff;
  padding: 12px 8px;
  box-shadow: var(--shadow-card);
  width: 100%;
  box-sizing: border-box;
}
.omurga-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.omurga-title {
  font-size: 15px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 0.5px;
}
.omurga-icon-btn {
  background: #334155;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.omurga-icon-btn:hover { background: #1e293b; }

.omurga-table-wrapper {
  border: 1px solid #E7DFE4;
  border-radius: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  box-sizing: border-box;
  background-color: #FFFCF7;
}
.omurga-table {
  width: 100%;
  min-width: 330px;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: inherit;
  font-size: 11.5px;
  background-color: #FFFCF7;
  color: #29212C;
}
.omurga-table thead tr { background: #F0E8EF; }
.omurga-table th {
  padding: 6px 2px;
  font-size: 11.5px;
  font-weight: 800;
  color: #29212C;
  background-color: #F0E8EF;
  border-right: 1px solid #E7DFE4;
  border-bottom: 1px solid #E7DFE4;
  text-align: center;
  box-sizing: border-box;
}
.omurga-table th:last-child { border-right: none; }
.omurga-table td {
  padding: 5px 2px;
  border-right: 1px solid #E7DFE4;
  border-bottom: 1px solid #E7DFE4;
  text-align: center;
  vertical-align: middle;
  box-sizing: border-box;
  color: #29212C;
}
.omurga-table td:last-child { border-right: none; }
.omurga-table tr:last-child td { border-bottom: none; }

/* Sayı ve frekans hücrelerinde eş genişlikli rakamlar */
.omurga-table .omurga-col-num,
.omurga-table .omurga-col-r,
.omurga-table .omurga-col-a {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* Hücre içi metin renkleri: koyu mürdüm editoryal uyum */
.omurga-table td span:not([style*="color:#94a3b8"]):not(.omurga-highlight-num) {
  color: #29212C !important;
}
.omurga-table td span[style*="color:#94a3b8"] {
  color: #9c8e9b !important;
}
.omurga-table .omurga-a-main {
  color: #29212C;
}
.omurga-table .omurga-a-sub {
  color: #635466;
}

/* Sütun genişlikleri - Toplam %100, taşma imkansız */
.omurga-col-dot { width: 7%; padding: 4px 1px !important; }
.omurga-col-r   { width: 11%; padding: 4px 1px !important; white-space: nowrap; }
.omurga-col-num { width: 9%; padding: 4px 1px !important; }
.omurga-col-h   { width: 22%; text-align: left !important; padding-left: 4px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.omurga-col-e   { width: 36%; text-align: left !important; padding-left: 4px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }
.omurga-col-a   { width: 15%; padding: 2px 1px !important; }

/* 480 px ve altı ekranlar: editoryal mobil gövde boyutu ve E sütunu satır bölme */
@media (max-width: 480px) {
  .omurga-table tbody td {
    font-size: 13px;
    line-height: 1.35;
  }
  .omurga-table .omurga-e-text {
    font-size: 13px !important;
    line-height: 1.35;
    word-break: break-all;
    overflow-wrap: anywhere;
  }
  .omurga-table .omurga-col-e {
    font-size: 13px !important;
    line-height: 1.35;
    white-space: normal !important;
    word-break: break-all;
    overflow-wrap: anywhere;
  }
}

/* Yeşil Nokta */
.omurga-green-dot {
  width: 10px;
  height: 10px;
  background: #16a34a;
  border-radius: 50%;
  display: inline-block;
  vertical-align: middle;
  box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.25);
}

/* Aktif Sayı Vurgusu (Mor Kutu) */
.omurga-highlight-num {
  background: #ddd6fe;
  color: #4338ca;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 5px;
  display: inline-block;
  cursor: pointer;
}

/* Pin Kodu Hane Açılımı (A Sütunu) */
.omurga-a-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  padding: 2px 1px;
  width: 100%;
  max-width: 42px;
  border: 1px solid rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  background: #ffffff;
  box-sizing: border-box;
  margin: 0 auto;
}
.omurga-a-box:hover {
  transform: scale(1.06);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.omurga-a-sub {
  font-size: 8.5px;
  font-weight: 700;
  color: #334155;
  line-height: 1;
}
.omurga-a-main {
  font-size: 12.5px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1.1;
}

/* Alt Özet Tablosu & Denge Sekansı */
.omurga-bottom-table {
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  overflow: hidden;
  margin-top: 14px;
  background: #ffffff;
  text-align: center;
}
.omurga-bottom-head-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: #eceff1;
  border-bottom: 1px solid #cbd5e1;
}
.omurga-bottom-th {
  padding: 10px 4px;
  font-size: 10.5px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 0.5px;
  border-right: 1px solid #cbd5e1;

/* ---------- Yardımcı görünüm parçaları ---------- */
function badge(n, cat, title){
  if (n === undefined || n === null || n === '') return '-';
  const num = Number(n);
  const master = (E && E.MASTER_NUMBERS) ? E.MASTER_NUMBERS.has(num) : [11, 22, 33, 44, 55, 66, 77, 88, 99].includes(num);
  const isKarmic = [13, 14, 16, 19].includes(num);
  const effectiveCat = cat || (isKarmic ? 'KarmicDebt' : (master ? 'MasterNumberVibrations' : 'NumericalVibration'));
  const effectiveTitle = String(title || (cat ? `${cat} ${n}` : `Sayı Titreşimi ${n}`)).replace(/'/g, "\\'");
  const cls = "num-badge" + (master ? " master" : "") + (isKarmic ? " karmic" : "");
  return `<span class="${cls}" onclick="NumerologyDefinitions.show('${effectiveCat}','${n}','${effectiveTitle}')" title="${effectiveTitle} — Detaylı bilgi kartı için tıklayın">${n}<span class="badge-dot">ℹ️</span></span>`;
}
function kvRows(pairs){
  return `<div class="kv">${pairs.map(([k,v])=>`<span class="k">${esc(k)}</span><span class="v">${v}</span>`).join("")}</div>`;
}
function meaning(n){
  return E.NUMBER_MEANINGS[n] ? `<div style="font-size:12px;color:#6b7686;margin-top:6px">${esc(E.NUMBER_MEANINGS[n])}</div>` : "";
}
function matrixHTML(m){
  return `<div class="matrix">${m.grid.flat().map(c=>
    `<div><b>${c.sayi}</b><span>${c.adet} adet</span></div>`).join("")}</div>`;
}
function tableHTML(headers, rows){
  return `<div class="data-table-wrap"><table class="data"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* Floating Hane Popover & Çakra Detay Modal Yöneticisi */
window.showOmurgaPopover = function(e, num) {
  if (e && e.stopPropagation) e.stopPropagation();
  const ot = window._currentOmurga;
  if (!ot || !ot.rows) return;
  const r = ot.rows.find(x => x.num === num);
  if (!r || r.aNum === null) return;

  let pop = document.getElementById('omurgaFloatingPopover');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'omurgaFloatingPopover';
    pop.className = 'omurga-popover';
    document.body.appendChild(pop);
    document.addEventListener('click', (evt) => {
      if (pop && !pop.contains(evt.target)) {
        pop.style.display = 'none';
      }
    });
  }

  const badgeColor = (r.uyum && r.uyum.title.includes('Zorlu')) ? '#f87171' : '#6ee7b7';

  pop.innerHTML = `
    <div style="position:relative;">
      <button type="button" onclick="document.getElementById('omurgaFloatingPopover').style.display='none'" style="position:absolute;top:-4px;right:-4px;background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:4px;line-height:1;" aria-label="Kapat">✕</button>

    </div>
  `;

  // Tıklanan kutunun konumuna göre yerleşim
  const target = e.currentTarget || e.target;
  const rect = target.getBoundingClientRect();
  pop.style.display = 'block';
  pop.style.visibility = 'hidden';

  requestAnimationFrame(() => {
    const popWidth = pop.offsetWidth || 280;
    const popHeight = pop.offsetHeight || 190;
    const padding = 12;

    if (window.innerWidth <= 640) {
      pop.style.left = '50%';
      let top = rect.bottom + 8;
      if (top + popHeight > window.innerHeight - padding) {
        top = Math.max(padding, rect.top - popHeight - 8);
      }
      if (top + popHeight > window.innerHeight - padding) {
        top = Math.max(padding, (window.innerHeight - popHeight) / 2);
      }
      pop.style.top = `${top}px`;
    } else {
      let left = rect.left - popWidth - 10;
      if (left < padding) {
        left = Math.max(padding, Math.min(window.innerWidth - popWidth - padding, rect.left));
      }

      let top = rect.top + (rect.height / 2) - (popHeight / 2);
      if (top < padding) top = padding;
      if (top + popHeight > window.innerHeight - padding) {
        top = window.innerHeight - popHeight - padding;
      }

      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }
    pop.style.visibility = 'visible';
  });
};

async function addPerson(){
  const name = ($("ws_name") ? $("ws_name").value.trim() : "");
  const d = ($("ws_d") ? $("ws_d").value.trim() : "");
  const m = ($("ws_m") ? $("ws_m").value.trim() : "");
  const y = ($("ws_y") ? $("ws_y").value.trim() : "");
  const city = ($("ws_place") ? $("ws_place").value.trim() : "");
  const country = ($("ws_country") ? $("ws_country").value : "") || "";
  const place = [city, country].filter(Boolean).join(", ");
  const hh = ($("ws_hh") ? $("ws_hh").value : "");
  const mm = ($("ws_mm") ? $("ws_mm").value : "");
  const time = (hh && mm) ? (hh + ":" + mm) : "";

  if(!name || !d || !m || !y){
    alert("Ad ve doğum tarihi (gün/ay/yıl) zorunludur.");
    return;
  }

  try {
    const res = await fetch('/api/people', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, d, m, y, time, place })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Kişi kaydedilemedi.');
      return;
    }
    await loadPeople();
    renderWorkspaceView();
  } catch (e) {
    alert('Sunucu bağlantı hatası.');
  }
}

async function removePerson(id){
  if(!confirm("Bu danışanı silmek istediğinizden emin misiniz?")) return;
  try {
    const res = await fetch('/api/people/' + id, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Kişi silinemedi.');
      return;
    }
    await loadPeople();
    renderWorkspaceView();
  } catch (e) {
    alert('Sunucu bağlantı hatası.');
  }
}

function analyzePerson(id){
  const people = window._peopleCache || [];
  const p = people.find(x => x.id === id) || people[0];
  if (!p) return;
  window._prefill = { name: p.name, d: p.d, m: p.m, y: p.y };
  openModule("holistic");
  setTimeout(() => {
    runModule("holistic");
  }, 40);
}

function fillFromSaved(id){
  if (!id) return;
  const numId = parseInt(id, 10);
  const p = (window._peopleCache || []).find(x => x.id === numId);
  if (!p) return;
  if ($("fld_name")) $("fld_name").value = p.name || "";
  if ($("fld_d")) $("fld_d").value = p.d || "";
  if ($("fld_m")) $("fld_m").value = p.m || "";
  if ($("fld_y")) $("fld_y").value = p.y || "";
}

async function addHistory(moduleId, inputs){
  try {
    const res = await fetch('/api/history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ moduleId, inputData: inputs })
    });
    if (!res.ok) {
      showHistorySaveWarning();
      return null;
    }
    return await res.json();
  } catch (err) {
    console.error('Analiz geçmişe kaydedilemedi:', err);
    showHistorySaveWarning();
    return null;
  }
}

function showHistorySaveWarning(){
  const notice = $("historySaveNotice");
  if (notice) {
    notice.style.display = "block";
  }
}

async function renderHistoryView(){
  closeSidebar();
  renderNav('history');
  $("crumb").textContent = "Geçmiş";
  $("content").innerHTML = `<div class="card" id="historyLoading"><h2>Geçmiş Analizler</h2><p class="desc" role="status">Yükleniyor…</p></div>`;
  const loading = $("historyLoading");
  try {
    const res = await fetch('/api/history');
    if (!res.ok) throw new Error('Geçmiş alınamadı');
    const items = await res.json();
    if (!loading.isConnected) return;
    window._historyCache = items;
    $("content").innerHTML = renderHistoryHtml(items);
  } catch (err) {
    if (loading.isConnected) $("content").innerHTML = `<div class="card"><h2>Geçmiş Analizler</h2><div class="empty">Geçmiş yüklenirken hata oluştu.</div></div>`;
  }
}

function renderHistoryHtml(items){
  if (!items || !items.length) {
    return `<div class="card"><h2>Geçmiş Analizler</h2><div class="empty">Henüz analiz çalıştırılmadı.</div></div>`;
  }
  return `<div class="card"><h2>Geçmiş Analizler (${items.length})</h2>
    ${items.map(item => {
      const inp = item.inputData || {};
      const summary = Object.keys(inp).map(k => `${k}: ${inp[k]}`).join(" · ");
      const at = item.createdAt ? new Date(item.createdAt).toLocaleString("tr-TR") : "";
      return `<div class="history-item">
        <div><div class="h-title">${esc(item.moduleName || item.moduleId)}</div>
        <div class="h-meta">${esc(at)} · ${esc(summary).slice(0,80)}</div></div>
        <span class="spacer"></span>
        <button class="btn-sm" onclick="viewHistoryItem(${item.id})">Görüntüle</button>
        <button class="btn-sm danger" onclick="delHistoryItem(${item.id})">Sil</button>
      </div>`;

// Both new and saved results arrive here; presentation only, never recalculation.
function prepareHolisticScreen() {
  const report = $('reportView');
  const body = report?.querySelector('.holistic-report-body');
  if (!body || report.classList.contains('holistic-screen')) return;
  report.classList.add('holistic-screen');
  const actions = report.parentElement.querySelector('.module-actions-bar');
  actions.classList.add('holistic-toolbar');
  report.querySelector('.report-head').after(actions);
  const a4 = body.querySelector('.a4-export-btn');
  if (a4) {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'btn-sm';
    button.textContent = 'A4 çıktıyı aç';
    button.onclick = () => a4.click();
    button.title = 'A4 hesaplama çıktısı — Yorum PDF’sinden ayrıdır';
    actions.append(button);
  }
  const pdf = $('analysisPdf');
  pdf.classList.remove('card');
  actions.append(pdf);
  const credits = document.createElement('span');
  credits.className = 'holistic-pdf-credits';
  credits.setAttribute('aria-live', 'polite');
  const pdfGroup = document.createElement('div');
  pdfGroup.className = 'holistic-pdf-group';
  actions.append(pdfGroup);
  pdfGroup.append(pdf, credits);
  ReportUI.credits(credits);

  const omurga = body.querySelector('.omurga-container');
  const core = document.createElement('div');
  core.className = 'holistic-omurga-core';
  omurga.prepend(core);
  core.append(omurga.querySelector('.omurga-top-bar'), omurga.querySelector('.omurga-card'));

  const kv = body.querySelector('.kv');
  const cells = Array.from(kv.children);
  for (let i = 0; i < cells.length; i += 2) {
    const item = document.createElement('div');
    item.className = 'holistic-indicator';
    item.append(cells[i], cells[i + 1]); kv.append(item);
  }
  const matrices = document.createElement('div');
  matrices.className = 'holistic-matrices';
  const allMatrices = Array.from(body.querySelectorAll('.matrix'));
  allMatrices[0].previousElementSibling.before(matrices);
  allMatrices.forEach(matrix => {
    const section = document.createElement('section');
    section.append(matrix.previousElementSibling, matrix); matrices.append(section);
  });
  const pair = document.createElement('div');
  pair.className = 'holistic-detail-pair';
  const headings = Array.from(body.querySelectorAll(':scope > h3'));
  const letters = headings.find(h => h.textContent === 'Harf Grupları');
  const planes = headings.find(h => h.textContent === 'İfade Düzlemleri');
  letters.before(pair);
  [letters, planes].forEach(h => {
    const section = document.createElement('section');
    section.append(h, h.nextElementSibling); pair.append(section);
  });
}

function triggerPostRender(idOrName, f) {
  if (!f) return;
  if (idOrName === 'holistic') prepareHolisticScreen();
  setTimeout(() => {
    const isDestiny = idOrName === 'destiny' || idOrName === 'Kader Matrisi';
    const isKarmic = idOrName === 'karmic' || idOrName === 'Karma Analizi (Ladini)';

    if (isDestiny && window.DestinyMatrixSVG && $('destinyMatrixSvgBox')) {
      DestinyMatrixSVG.render('destinyMatrixSvgBox', { d: f.d, m: f.m, y: f.y, name: f.name });
    }
    if (isKarmic && window.KarmicSVG && $('karmicSvgBox')) {
      KarmicSVG.render('karmicSvgBox', { d: f.d, m: f.m, y: f.y, name: f.name });
    }
  }, 30);
}

    <div class="report-section">${html}</div>

      </section>
    </section>`;
  $('dashboardPlan').textContent = subscription.plan_name;
  $('dashboardExpiry').textContent = dashboardDate(subscription.expires_at);
  ReportUI.credits($('dashboardPdfCredits'));

  const recent = $('dashboardRecent');
  try {
    const res = await fetch('/api/history');
    if (!recent.isConnected) return;
    if (res.status === 401) {
      window.location.href = '/hesap';
      return;
    }
    if (!res.ok) throw new Error('Geçmiş alınamadı');
    const items = await res.json();
    if (!recent.isConnected) return;
    window._historyCache = items;
    const latest = items.slice(0, 5);
    if (!latest.length) {
      recent.firstElementChild.textContent = 'Henüz analiz kaydı yok. İlk analizini başlattığında burada görebilirsin.';
      return;
    }
    const list = document.createElement('ul');
    list.className = 'dashboard-history-items';
    for (const item of latest) {
      const row = document.createElement('li');
      row.className = 'dashboard-history-row';
      const details = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = item.moduleName || item.moduleId;
      const date = document.createElement('p');
      date.textContent = dashboardDate(item.createdAt, true);
      details.append(title, date);
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'dashboard-button';
      open.textContent = 'Görüntüle';
      open.setAttribute('aria-label', `${title.textContent} kaydını görüntüle, ${date.textContent}`);
      open.addEventListener('click', () => {
        renderNav('history');
        viewHistoryItem(item.id);
      });
      row.append(details, open);
      list.append(row);
    }
    recent.replaceChildren(list);
  } catch (err) {
    if (recent.isConnected) recent.firstElementChild.textContent = 'Son analizler şu anda yüklenemedi.';
  } finally {
    recent.setAttribute('aria-busy', 'false');
  }
}

async function logout(){
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } catch (err) {}
  window.location.href = '/hesap';
}

async function renderWorkspaceView(){
  closeSidebar();
  renderNav('workspace');
  $("crumb").textContent = "Çalışma Alanım";
  $("content").innerHTML = '<p id="workspaceLoading" role="status">Kayıtlı kişiler yükleniyor…</p>';
  const loading = $("workspaceLoading");
  await loadPeople();
  if (loading.isConnected) $("content").innerHTML = renderWorkspace();
}

function toggleSidebar(){
  const sb = $("sidebar");
  const bd = $("sidebarBackdrop");
  if(!sb) return;
  const isOpen = sb.classList.toggle("open");
  if(bd) bd.classList.toggle("open", isOpen);
}
function closeSidebar(){
  const sb = $("sidebar");
  const bd = $("sidebarBackdrop");
  if(sb) sb.classList.remove("open");
  if(bd) bd.classList.remove("open");
}

/* ---------- Olay Dinleyicileri ---------- */
$("btnLogout").addEventListener("click", logout);
$("btnWorkspace").addEventListener("click", renderWorkspaceView);
$("btnHistory").addEventListener("click", renderHistoryView);

/* ---------- Başlat ---------- */
(async function boot(){
  const ok = await checkSession();
  if (!ok) return;
  await loadPeople();
  renderMemberDashboard();
})();
</script>
